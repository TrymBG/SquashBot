# CI: on every pull request and every push to main, GitHub runs the same checks we run by hand before a PR.
# A red ❌ means something is broken; the branch rule on main blocks merging until it's green ✅.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run that's still going (no point finishing an outdated one).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # same as the laptop and the server
          cache: npm # reuse downloaded packages between runs
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install (backend)
        run: npm ci

      - name: Install (website)
        run: npm ci
        working-directory: web

      - name: Typecheck (backend)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Typecheck (website)
        run: npm run typecheck
        working-directory: web

      - name: Lint (website)
        run: npm run lint
        working-directory: web

      - name: Build (backend + website)
        run: npm run build
